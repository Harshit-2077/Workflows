name: Poco F6 Clang 19 kernel and WLAN
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-peridot.yml'
      - 'scripts/build-peridot.sh'
      - 'patches/**'
permissions:
  contents: read
concurrency:
  group: peridot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 lld-19 build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev dwarves cpio rsync zip kmod
      - name: Compile kernel, WLAN and dependencies
        env:
          JOBS: '4'
        run: bash scripts/build-peridot.sh
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peridot-clang19-kernel-wlan
          path: |
            build/dist/Image
            build/dist/modules.tar.gz
            build/dist/kernel.config
            build/dist/Module.symvers
            build/dist/System.map
            build/dist/kernelrelease.txt
            build/dist/wlan-modinfo.txt
            build/dist/source-revisions.txt
            build/dist/SHA256SUMS
            build/dist/BUILD_SUCCESS
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-build-diagnostics
          path: build/dist/logs/
          if-no-files-found: warn
