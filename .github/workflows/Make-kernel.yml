
name: Poco F6 Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

concurrency:
  group: poco-f6-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8635.git
      MODULES_REPO: https://github.com/peridot-dev/android_kernel_xiaomi_sm8635-modules.git
      BRANCH: lineage-23.2
      ARCH: arm64
      OUT: ${{ github.workspace }}/kernel-out

    steps:
      - name: Checkout workflow and patch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves python3 python-is-python3 \
            cpio rsync unzip zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            wget ca-certificates

      - name: Install LLVM and Clang 19
        run: |
          set -euxo pipefail

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19

          sudo apt-get install -y \
            clang-19 llvm-19 lld-19

          clang-19 --version
          ld.lld-19 --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b "$BRANCH" "$KERNEL_REPO" kernel

      - name: Clone external modules
        run: |
          git clone --depth=1 \
            -b "$BRANCH" "$MODULES_REPO" modules

      - name: Record source revisions
        run: |
          {
            echo "Kernel:"
            git -C kernel rev-parse HEAD
            echo "Modules:"
            git -C modules rev-parse HEAD
            echo "Compiler:"
            clang-19 --version
          } | tee source-revisions.txt

      - name: Check and apply injection patch
        run: |
          set -euxo pipefail

          PATCH="$GITHUB_WORKSPACE/patches/0001-poco-f6-sm8635-monitor-injection.patch"
          test -s "$PATCH"

          cd modules

          git apply --check "$PATCH"
          git apply --stat "$PATCH"
          git apply "$PATCH"
          git diff --check
          git diff --stat

      - name: Configure kernel
        run: |
          set -euxo pipefail

          cd kernel
          mkdir -p "$OUT"

          export ARCH=arm64
          export LLVM=-19
          export LLVM_IAS=1

          make O="$OUT" gki_defconfig

          for fragment in \
            arch/arm64/configs/vendor/pineapple_GKI.config \
            arch/arm64/configs/vendor/peridot_GKI.config
          do
            if [ ! -f "$fragment" ]; then
              echo "Missing expected config fragment: $fragment"
              exit 1
            fi
          done

          scripts/kconfig/merge_config.sh \
            -m -O "$OUT" \
            "$OUT/.config" \
            arch/arm64/configs/vendor/pineapple_GKI.config \
            arch/arm64/configs/vendor/peridot_GKI.config

          # Disable module signing
          scripts/config --file "$OUT/.config" \
            -d MODULE_SIG \
            -d MODULE_SIG_ALL \
            -d MODULE_SIG_FORCE

          make O="$OUT" olddefconfig

          # Verify module signing is disabled
          if grep -q '^CONFIG_MODULE_SIG=y' "$OUT/.config"; then
            echo "ERROR: Module signing is enabled"
            exit 1
          fi

          echo "Module signing is disabled or unsupported by this kernel configuration."

          grep -E 'CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_ALL|CONFIG_MODULE_SIG_FORCE' \
            "$OUT/.config" || true

          cp "$OUT/.config" "$GITHUB_WORKSPACE/kernel-config.txt"

          # 1. Fix OpenSSL 3.0 undeclared 'key_pass' on Ubuntu 24.04 runners
          if [[ -f "$ROOT/certs/extract-cert.c" ]]; then
            sed -i '/static.*key_pass/d' "$ROOT/certs/extract-cert.c"
            sed -i '1i __attribute__((unused)) static const char *key_pass;' "$ROOT/certs/extract-cert.c"
          fi
          
      - name: Build kernel with Clang 19
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=-19
          export LLVM_IAS=1
          export CC=clang-19
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=ubuntu

          clang-19 --version

          make -j"$(nproc)" \
            O="$OUT" \
            Image modules dtbs

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts

          [ ! -f "$OUT/arch/arm64/boot/Image" ] || \
            cp "$OUT/arch/arm64/boot/Image" artifacts/

          [ ! -f "$OUT/vmlinux" ] || \
            cp "$OUT/vmlinux" artifacts/

          [ ! -f "$OUT/Module.symvers" ] || \
            cp "$OUT/Module.symvers" artifacts/

          [ ! -f "$OUT/.config" ] || \
            cp "$OUT/.config" artifacts/kernel.config

          [ ! -f kernel-config.txt ] || \
            cp kernel-config.txt artifacts/

          [ ! -f source-revisions.txt ] || \
            cp source-revisions.txt artifacts/

          git -C modules diff \
            > artifacts/monitor-injection.patch.diff

          tar -czf artifacts/patched-modules-source.tar.gz modules

      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-clang19-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
